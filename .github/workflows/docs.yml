name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: robomimic
      - uses: actions/checkout@v4
        with:
          repository: mishmish66/jax-pomdps
          path: jax_mdps
      - uses: astral-sh/setup-uv@v6
      - name: Build
        working-directory: robomimic
        env:
          JAX_PLATFORMS: cpu
        run: uv run --extra video --with pdoc python docs/build.py --out ../site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
