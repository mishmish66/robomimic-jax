[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robomimic"
version = "0.5.0"
description = "Robomimic's manipulation tasks as jax_mdps POMDPs on MuJoCo Warp, and the robomimic demonstration datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "h5py",
    "huggingface_hub",
    "PyOpenGL",
    "mujoco==3.14.0",
    "mujoco-mjx==3.14.0",
    "mujoco-warp==3.14.0",
    "warp-lang==1.17.0",
    "jax[cuda13]>=0.11.2",
    "jax-mdps",
]

[project.optional-dependencies]
video = ["imageio", "imageio-ffmpeg", "Pillow"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
jax-mdps = { path = "../jax_mdps", editable = true }

[tool.setuptools.packages.find]
include = ["robomimic*"]

[tool.setuptools.package-data]
robomimic = ["data/*"]
