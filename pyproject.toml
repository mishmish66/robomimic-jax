[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robomimic"
version = "0.5.0"
description = "A slop fork of robomimic and robosuite: their manipulation tasks as jax_pomdps POMDPs on MuJoCo Warp, with the robomimic demonstrations transferred into them"
readme = "README.md"
license = "LicenseRef-VibeCoded-AI-Slop-1.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "h5py",
    "huggingface_hub",
    "PyOpenGL",
    "mujoco==3.14.0",
    "mujoco-mjx==3.14.0",
    "mujoco-warp==3.14.0",
    "warp-lang==1.17.0",
    "jax[cuda13]>=0.11.2",
    "jax-pomdps",
]

[project.optional-dependencies]
video = ["imageio", "imageio-ffmpeg", "Pillow"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
jax-pomdps = { git = "https://github.com/mishmish66/jax-pomdps.git" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robomimic.env" = ["assets/*"]
